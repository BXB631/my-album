appId: com.myalbum.desktop
productName: 我的相册
copyright: Copyright © 2026 我的相册
asar: false
npmRebuild: false
compression: normal
electronDist: node_modules/electron/dist
directories:
  output: dist
  buildResources: assets
files:
  - server.js
  - package.json
  - lib/**/*
  - public/**/*
  - electron/**/*
  - assets/**/*
  - node_modules/**/*
  - "!node_modules/.bin/**"
  - "!node_modules/electron/**"
  - "!node_modules/electron-builder/**"
  - "!**/*.map"
  - "!**/*.md"
  - "!**/*.ts"
  - "!data/**"
  - "!cache/**"
  - "!photos/**"
  - "!dist/**"
  - "!tools/**"
  - "!*.bat"
  - "!.pnpm-store/**"
  - "!pnpm-lock.yaml"
  - "!pnpm-workspace.yaml"
  - "!README.md"
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico
  artifactName: 我的相册-${version}-安装包.${ext}
  requestedExecutionLevel: asInvoker
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: 我的相册
  uninstallDisplayName: 我的相册
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  language: "2052"
  installerLanguages:
    - zh_CN
  artifactName: 我的相册-${version}-安装包.${ext}
