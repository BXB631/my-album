name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: Syntax check
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check syntax
        run: pnpm check

      - name: Geometry unit test
        run: pnpm test:geometry

      - name: Streaming smoke test
        run: pnpm test:stream

      - name: Sidebar folder tree test
        run: pnpm test:nav

      # 实况照片测试用的素材在仓库外（工作区 testmedia\），CI 上没有时脚本会自己跳过。
      - name: Live photo test
        run: pnpm test:live

      - name: Cache clearing test
        run: pnpm test:cache
