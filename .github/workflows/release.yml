name: Release source package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package source
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.28.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check syntax
        run: pnpm check

      - name: Run streaming tests
        run: |
          pnpm test:geometry
          pnpm test:stream

      # 这里只是把源码打个包当构建产物附在 workflow 运行记录里。
      # 正式的发布件（安装包 / 免安装版 / 源码 zip）由本机的 `pnpm pack` + `pnpm release`
      # 生成到 release\v<版本>\，再手动传到 GitHub Release（见 docs/PUBLISHING.md）。
      # git archive 只导出已提交的文件，data/、cache/、node_modules/ 天然不会进去。
      - name: Package source
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $name = "my-album-$version.zip"
          git archive --format=zip --output=$name HEAD
          "ARCHIVE_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: source-package
          path: ${{ env.ARCHIVE_NAME }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: 我的相册 ${{ github.ref_name }}
          generate_release_notes: true
          files: ${{ env.ARCHIVE_NAME }}
          fail_on_unmatched_files: true